<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>French TEF Daily Journal</title>
<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f7f7f5;
    color: #1f2937;
  }
  #loading {
    max-width: 760px;
    margin: 80px auto;
    padding: 24px;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
  }
  #error {
    color: #991b1b;
    white-space: pre-wrap;
  }
</style>
</head>
<body>
<div id="loading">
  <h2>Loading French journal…</h2>
  <p id="error"></p>
</div>

<script>
(async function () {
  const error = document.getElementById("error");

  // Immutable copy of the Oct 18 merger page.
  const mergerUrl =
    "https://raw.githubusercontent.com/pepperboy123456-beep/fr/0e928f487de056163a01b812f34f4c076eb5956a/index.html";

  // Last good journal before the Oct 18 merger replaced index.html.
  const baseJournalUrl =
    "https://raw.githubusercontent.com/pepperboy123456-beep/fr/fb104e476fa84998aa89c9ace476840db35560b6/index.html";

  try {
    const response = await fetch(mergerUrl, { cache: "no-store" });
    if (!response.ok) {
      throw new Error("Could not load the Oct 18 journal merger: HTTP " + response.status);
    }

    let source = await response.text();

    // The Oct 18 merger originally pointed to main/index.html, which made it
    // recursively load itself. Point it at the last good journal instead.
    const recursiveUrl =
      "https://raw.githubusercontent.com/pepperboy123456-beep/fr/main/index.html";

    if (!source.includes(recursiveUrl)) {
      throw new Error("Could not find the old self-referencing source URL.");
    }

    source = source.replace(recursiveUrl, baseJournalUrl);

    // Add Oct 28 learning directly into the merged journal's Common Phrases bank.
    const patchAnchor =
      "    // Make relative behavior/scripts work by adding a base URL for GitHub source.";

    const oct28Patch = String.raw`
    // Oct 28 — useful structures from "Le bac, à quoi ça sert ?"
    const oct28LastUpdated = doc.getElementById("last-updated");
    if (oct28LastUpdated) {
      oct28LastUpdated.textContent = "Last updated: October 28, 2026";
    }

    const oct28PhraseTbody = doc.querySelector("#phrases-panel .bank-table tbody");
    if (oct28PhraseTbody) {
      const oct28Rows = [
        { fr: "faire l’objet de", en: "to be the subject of", group: "conversation", example: "Le bac fait l’objet de nombreuses questions. = The bac is the subject of many questions. Fixed expression: do not translate it word-for-word." },
        { fr: "a-t-il… ?", en: "does he/it have…?", group: "questions", example: "Le bac a-t-il une valeur ? = Does the bac have value? Formal inversion; -t- is inserted for pronunciation." },
        { fr: "même si ça reste…", en: "even though / even if it remains…", group: "conversation", example: "même si = even if/even though; ça = it/that; reste = remains/stays." },
        { fr: "j’ai arrêté… / je me suis arrêté(e)", en: "I stopped/quit… / I stopped, came to a stop", group: "conversation", example: "arrêter quelque chose = stop something; s’arrêter = come to a stop. J’ai arrêté l’école. = I quit/stopped school." },
        { fr: "lycéen / lycéenne en terminale", en: "high-school student in the final year", group: "classroom", example: "The lycée years are: seconde → première → terminale." },
        { fr: "car / parce que", en: "because", group: "conversation", example: "Both mean because. Parce que is more common in everyday speech; car is more written/formal." },
        { fr: "formation (sur un CV)", en: "education / training", group: "classroom", example: "Sur un CV, la partie formation = the education/training section." },
        { fr: "t’es pas…", en: "you’re not… (casual)", group: "conversation", example: "Spoken tu n’es pas often becomes t’es pas. In casual speech, ne is commonly dropped." },
        { fr: "franchement", en: "honestly / frankly", group: "conversation", example: "Franchement, ça sert à rien. = Honestly, it’s useless." },
        { fr: "ça sert à… / ça sert à rien", en: "it is useful for… / it’s useless", group: "conversation", example: "servir à = to be useful for / serve a purpose. Ça sert à quoi ? = What is it for?" },
        { fr: "ça, c’est…", en: "that / this is…", group: "conversation", example: "Ça, c’est important. = That is important." },
        { fr: "la frime / pour la frime", en: "showing off / just to show off", group: "conversation", example: "Juste pour la frime. = Just to show off." },
        { fr: "ce qu’on ne sait pas…", en: "what people / we don’t know…", group: "conversation", example: "ce que = what/the thing that; on = people/we; ne sait pas = doesn’t/don’t know." },
        { fr: "je me suis renseigné(e)", en: "I looked into it / found out more", group: "conversation", example: "se renseigner = to get information / look into something. Add -e for a feminine speaker: renseignée." },
        { fr: "ce qui compte le plus…", en: "what matters most…", group: "conversation", example: "compter can mean to count, but here it means to matter." },
        { fr: "se payer les études", en: "to pay for / afford one’s studies", group: "conversation", example: "payer = to pay; un pays = a country. They are different words." },
        { fr: "par contre", en: "on the other hand / however", group: "conversation", example: "Par contre, pour un travail qui nécessite des études supérieures, non." },
        { fr: "il y a", en: "there is / there are", group: "conversation", example: "Il y a un problème. = There is a problem. Learn il y a as one fixed chunk rather than translating it word-for-word." },
        { fr: "il y avait", en: "there was / there were", group: "conversation", example: "Il y avait beaucoup de phrases différentes. = There were a lot of different phrases." },
        { fr: "il y aura", en: "there will be", group: "future", example: "Il y aura un examen demain. = There will be a test tomorrow." },
        { fr: "il y avait ≠ il était", en: "there was/were ≠ he/it was", group: "conversation", example: "Il y avait un problème. = There was a problem. Il était difficile. = It was difficult." },
        { fr: "il y a + durée", en: "… ago", group: "conversation", example: "J’ai commencé à apprendre le français il y a un an. = I started learning French one year ago. This is another use of il y a." }
      ];

      for (const item of oct28Rows) {
        const exists = [...oct28PhraseTbody.querySelectorAll("td:first-child")]
          .some(td => td.textContent.trim() === item.fr);
        if (exists) continue;

        const tr = doc.createElement("tr");
        tr.className = "phrase-row";
        tr.dataset.group = item.group;
        tr.dataset.search = (item.fr + " " + item.en + " " + item.group + " " + item.example).toLowerCase();

        const frTd = doc.createElement("td");
        const frSpan = doc.createElement("span");
        frSpan.className = "fr";
        frSpan.textContent = item.fr;
        frTd.appendChild(frSpan);

        const enTd = doc.createElement("td");
        enTd.textContent = item.en;

        const groupTd = doc.createElement("td");
        const groupSpan = doc.createElement("span");
        groupSpan.className = "verb-tag";
        groupSpan.textContent = item.group.charAt(0).toUpperCase() + item.group.slice(1);
        groupTd.appendChild(groupSpan);

        const exampleTd = doc.createElement("td");
        exampleTd.textContent = item.example;

        tr.append(frTd, enTd, groupTd, exampleTd);
        oct28PhraseTbody.appendChild(tr);
      }
    }
`;

    if (!source.includes(patchAnchor)) {
      throw new Error("Could not find the merge point for the Oct 28 phrase update.");
    }
    source = source.replace(patchAnchor, oct28Patch + "\n\n" + patchAnchor);

    document.open();
    document.write(source);
    document.close();
  } catch (e) {
    console.error(e);
    error.textContent =
      "Could not load the French journal.\n" +
      (e && e.message ? e.message : String(e));
  }
})();
</script>
</body>
</html>
