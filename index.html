<h2>🎬 Oct 18 — Conversation prep with Rehab: movies + core grammar</h2>
<div class="meta">Spontaneous speaking corrections • movie vocabulary • reflexive verbs • savoir vs connaître • COD/COI • useful conversation chunks</div>

<div class="orange-note">
<strong>High-priority speaking chunks from today</strong><br/><br/>
<span class="fr">Comment s’est passée ta semaine ?</span> = How was your week?<br/>
<span class="fr">Ma semaine s’est bien passée.</span> = My week went well.<br/>
<span class="fr">Tu as entendu parler de ce film ?</span> = Have you heard of this movie?<br/>
<span class="fr">Je n’avais aucune attente.</span> = I had no expectations.<br/>
<span class="fr">Ça parle d’une fille qui se réveille dans une chambre.</span> = It’s about a girl who wakes up in a room.<br/>

<span class="fr">À part ça, pas grand-chose.</span> = Other than that, not much.<br/>
<span class="fr">Je te recommande de le regarder.</span> = I recommend that you watch it.<br/>
<span class="fr">Je viens de prendre un abonnement à Apple TV+.</span> = I just got an Apple TV+ subscription.<br/>
<span class="fr">Pour le moment, je n’ai encore rien regardé.</span> = So far, I haven’t watched anything yet.
</div>

<h3>1. Se passer + passé composé</h3>
<div class="note">
<strong>se passer</strong> = to happen / to go.<br/><br/>
<span class="fr">Comment s’est passée ta semaine ?</span><br/>
<span class="fr">Ma semaine s’est bien passée.</span><br/><br/>
<span class="fr">Le week-end s’est bien passé.</span><br/>
<span class="fr">La semaine s’est bien passée.</span>
</div>

<script>
(async function() {
  const sourceUrl = "https://raw.githubusercontent.com/pepperboy123456-beep/fr/main/index.html";
  const loading = document.getElementById("loading");
  const err = document.getElementById("error");

  try {
    const response = await fetch(sourceUrl, { cache: "no-store" });
    if (!response.ok) throw new Error("Could not load GitHub index.html: HTTP " + response.status);
    const source = await response.text();

    const parser = new DOMParser();
    const doc = parser.parseFromString(source, "text/html");

    // Update the visible last-updated marker.
    const lastUpdated = doc.getElementById("last-updated");
    if (lastUpdated) lastUpdated.textContent = "Last updated: October 18, 2026";

    // FIX EXISTING GITHUB MARKUP:
    // The current source has three verb entries nested inside the "Verb Bank" tab button.
    // Preserve their content, but remove them from the button so the nav stays clean.
    const verbsTab = doc.getElementById("verbs-tab");
    const misplacedVerbEntries = [];
    if (verbsTab) {
      verbsTab.querySelectorAll(".verb-bank-added").forEach(node => {
        misplacedVerbEntries.push(node.textContent.trim());
        node.remove();
      });
      // Ensure only the tab label remains as visible text.
      // Preserve any future non-div children, but normalize the leading label.
      const textNodes = [...verbsTab.childNodes].filter(n => n.nodeType === 3);
      if (textNodes.length) {
        textNodes[0].nodeValue = "Verb Bank";
        for (let i = 1; i < textNodes.length; i++) textNodes[i].nodeValue = "";
      } else {
        verbsTab.insertBefore(doc.createTextNode("Verb Bank"), verbsTab.firstChild);
      }
    }

    // Add today's section to the top of the Study Journal, after last-updated.
    const template = document.getElementById("oct18-template");
    const fragmentDoc = parser.parseFromString("<body>" + template.innerHTML + "</body>", "text/html");
    const oct18 = fragmentDoc.body.firstElementChild;

    const journal = doc.getElementById("journal-panel");
    if (journal && oct18) {
      const existing = doc.getElementById("rehab-conversation-oct18");
      if (existing) existing.remove();
      const marker = doc.getElementById("last-updated");
      if (marker && marker.parentNode) marker.insertAdjacentElement("afterend", oct18);
      else journal.prepend(oct18);
    }

    // Add useful new entries to the Verb Bank if the bank exists.
    const verbTbody = doc.querySelector("#verb-bank-panel .verb-table tbody");
    if (verbTbody) {
      // Preserve the three entries that were incorrectly inside the tab button.
      const preservedRows = [
        ['garer','to park','everyday','Je gare ma voiture dehors.','garé'],
        ['se coucher','to go to bed','everyday','Je me couche tôt.','couché'],
        ['partir de chez soi','to leave home','everyday','Je pars de chez moi à huit heures.','parti']
      ];
      for (const [verb, meaning, group, example, pp] of preservedRows) {
        if ([...verbTbody.querySelectorAll("td:first-child")].some(td => td.textContent.trim() === verb)) continue;
        const tr = doc.createElement("tr");
        tr.className = "verb-row";
        tr.dataset.group = group;
        tr.dataset.search = (verb+" "+meaning+" "+group+" "+example+" "+pp).toLowerCase();
        tr.innerHTML = `<td><span class="fr">${verb}</span></td><td>${meaning}</td><td><span class="verb-tag">${group}</span></td><td><span class="fr">${example}</span></td><td><span class="fr">${pp}</span></td>`;
        verbTbody.appendChild(tr);
      }

      const rows = [
        ['se passer','to happen / to go','common','Comment s’est passée ta semaine ?','passé'],
        ['entendre','to hear','common','J’ai entendu un bruit.','entendu'],
        ['entendre parler de','to have heard of / hear about','common','Tu as entendu parler de ce film ?','entendu'],
        ['écouter','to listen to','common','J’écoute de la musique.','écouté'],
        ['se réveiller','to wake up','common','Elle se réveille dans une chambre.','réveillé'],
        ['trouver','to find / consider','common','Je trouve ce film intéressant.','trouvé'],
        ['recommander','to recommend','common','Je te recommande de le regarder.','recommandé'],
        ['rendre','to make / render','common','Ils ont rendu le film drôle.','rendu']
      ];
      for (const [verb, meaning, group, example, pp] of rows) {
        if ([...verbTbody.querySelectorAll("td:first-child")].some(td => td.textContent.trim() === verb)) continue;
        const tr = doc.createElement("tr");
        tr.className = "verb-row";
        tr.dataset.group = group;
        tr.dataset.search = (verb+" "+meaning+" "+group+" "+example+" "+pp).toLowerCase();
        tr.innerHTML = `<td><span class="fr">${verb}</span></td><td>${meaning}</td><td><span class="verb-tag">${group}</span></td><td><span class="fr">${example}</span></td><td><span class="fr">${pp}</span></td>`;
        verbTbody.appendChild(tr);
      }
    }

    // Add new Common Phrases.
    const phraseTbody = doc.querySelector("#phrases-panel .bank-table tbody");
    if (phraseTbody) {
      const rows = [
        ['Comment s’est passée ta semaine ?','How was your week?','questions'],
        ['Ma semaine s’est bien passée.','My week went well.','conversation'],
        ['Tu as entendu parler de ce film ?','Have you heard of this movie?','questions'],
        ['Je n’avais aucune attente.','I had no expectations.','conversation'],
        ['Ça parle d’une fille qui se réveille...','It’s about a girl who wakes up...','conversation'],
        ['Elle ne sait pas où elle est.','She doesn’t know where she is.','conversation'],
        ['À part ça, pas grand-chose.','Other than that, not much.','conversation'],
        ['Je te recommande de le regarder.','I recommend that you watch it.','conversation'],
        ['Je viens de prendre un abonnement à Apple TV+.','I just got an Apple TV+ subscription.','conversation'],
        ['Je n’ai encore rien regardé.','I haven’t watched anything yet.','conversation']
      ];
      for (const [fr, en, group] of rows) {
        if ([...phraseTbody.querySelectorAll("td:first-child")].some(td => td.textContent.trim() === fr)) continue;
        const tr = doc.createElement("tr");
        tr.className = "phrase-row";
        tr.dataset.group = group;
        tr.dataset.search = (fr+" "+en+" "+group).toLowerCase();
        tr.innerHTML = `<td><span class="fr">${fr}</span></td><td>${en}</td><td><span class="verb-tag">${group}</span></td><td>Oct 18</td>`;
        phraseTbody.appendChild(tr);
      }
    }

    // Add new nouns.
    const nounTbody = doc.querySelector("#nouns-panel .bank-table tbody");
    if (nounTbody) {
      const rows = [
        ['une attente','expectation','everyday'],
        ['un abonnement','subscription','everyday'],
        ['un sujet','topic / subject','language'],
        ['les gens','people (in general)','people'],
        ['une personne','person','people'],
        ['une émeute','riot','everyday'],
        ['l’IA','AI / artificial intelligence','language'],
        ['le monde entier','the whole world','everyday']
      ];
      for (const [fr, en, group] of rows) {
        if ([...nounTbody.querySelectorAll("td:first-child")].some(td => td.textContent.trim() === fr)) continue;
        const tr = doc.createElement("tr");
        tr.className = "noun-row";
        tr.dataset.group = group;
        tr.dataset.search = (fr+" "+en+" "+group).toLowerCase();
        tr.innerHTML = `<td><span class="fr">${fr}</span></td><td>${en}</td><td><span class="verb-tag">${group}</span></td>`;
        nounTbody.appendChild(tr);
      }
    }

    // Make relative behavior/scripts work by adding a base URL for GitHub source.
    const base = doc.createElement("base");
    base.href = "https://raw.githubusercontent.com/pepperboy123456-beep/fr/main/";
    doc.head.prepend(base);

    // Replace this loader with the merged document.
    const merged = "<!DOCTYPE html>\n" + doc.documentElement.outerHTML;
    document.open();
    document.write(merged);
    document.close();
  } catch (e) {
    err.textContent = "Could not merge the GitHub page automatically.\n" + e.message;
  }
})();
</script>
